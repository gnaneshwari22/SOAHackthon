name: Build, Test & CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Test Microservices (Java 21)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: auth_db
          POSTGRES_USER: soa_auth_user
          POSTGRES_PASSWORD: soa_auth_pass_2026
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build All Microservices with Maven
        run: |
          cd backend
          mvn -B clean install -DskipTests

      - name: Run JUnit 5, Mockito & AssertJ Test Suites
        run: |
          cd backend
          mvn test

      - name: Run Schema Contract Tests
        run: |
          echo "Validating Kafka JSON Schema contracts..."
          test -f infrastructure/kafka/CertificateRetired-schema.json

      - name: Set up Node.js for Frontend Build
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies & Run Build
        run: |
          npm ci
          npm run build
          npm run lint

      - name: Verify Docker Compose Configuration
        run: |
          docker compose -f infrastructure/docker-compose.yml config
